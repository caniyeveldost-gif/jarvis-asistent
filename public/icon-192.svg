      <stop offset="0%" stop-color="#0e2338" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="cyanGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="url(#bgGlow192)" />
  <rect width="188" height="188" x="2" y="2" rx="34" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="2" />

  <!-- Outer HUD Rings -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="96" cy="96" r="58" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="10 8" />

  <!-- Arc Reactor Center Core -->
