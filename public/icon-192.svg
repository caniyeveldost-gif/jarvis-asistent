<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2439" />
      <stop offset="70%" stop-color="#071220" />
      <stop offset="100%" stop-color="#040812" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4" />

  <!-- Main Scaled Group -->
  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
    <!-- Outer Glow & HUD Orbit Rings -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="256" cy="256" r="184" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="24 12" />
    <circle cx="256" cy="256" r="156" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="36 16" />
    <circle cx="256" cy="256" r="132" fill="none" stroke="#0284c7" stroke-opacity="0.6" stroke-width="2" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="3" stroke-dasharray="14 10" />

    <!-- Arc Reactor Core Housing -->
    <circle cx="256" cy="256" r="92" fill="#041527" stroke="#22d3ee" stroke-width="6" />
    <circle cx="256" cy="256" r="64" fill="#082f49" stroke="#38bdf8" stroke-width="4" />
    <circle cx="256" cy="256" r="38" fill="url(#coreGlow)" />

    <!-- 10 Reactor Segment Coils -->
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="256" y1="128" x2="256" y2="152" />
      <line x1="256" y1="360" x2="256" y2="384" />
      <line x1="128" y1="256" x2="152" y2="256" />
      <line x1="360" y1="256" x2="384" y2="256" />
      <line x1="165" y1="165" x2="182" y2="182" />
      <line x1="347" y1="347" x2="330" y2="330" />
      <line x1="347" y1="165" x2="330" y2="182" />
      <line x1="165" y1="347" x2="182" y2="330" />
    </g>

    <!-- Center Pulse Core -->
    <circle cx="256" cy="256" r="16" fill="#f0fdfa" />

    <!-- Clean Vector Wordmark JARVIS using SVG paths for 100% precision rendering -->
    <!-- J -->
    <path d="M 148 430 L 160 430 L 160 452 Q 160 462 148 462 Q 136 462 136 452" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- A -->
    <path d="M 188 462 L 202 430 L 216 462 M 193 452 L 211 452" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R -->
    <path d="M 242 462 L 242 430 L 258 430 Q 268 430 268 441 Q 268 450 258 450 L 242 450 M 256 450 L 268 462" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- V -->
    <path d="M 294 430 L 308 462 L 322 430" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- I -->
    <path d="M 346 430 L 346 462" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- S -->
    <path d="M 390 436 Q 374 430 374 440 Q 374 446 390 449 Q 396 451 396 456 Q 396 462 374 462" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>